name: 中美出口管制时间线自动更新

on:
  schedule:
    # 每日 18:00 北京时间（UTC+8 = 10:00 UTC）
    - cron: '0 10 * * *'
  workflow_dispatch: # 手动触发

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run timeline agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.TIMELINE_GITHUB_TOKEN }}
        run: python timeline_agent.py

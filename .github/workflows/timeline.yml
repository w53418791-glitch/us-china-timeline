name: 中美出口管制时间线自动更新

on:
  schedule:
    # 每日 3 次北京时间（UTC+8）
    # 08:00 北京 = 00:00 UTC（早班，美东前日午后，抓隔夜发布）
    # 18:00 北京 = 10:00 UTC（晚班，联邦公报发布后数小时，抓当天新动作）
    # 00:00 北京 = 16:00 UTC（夜班，美东上午，抓当日美方新动作）
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: # 手动触发

# 9/23 修正：改用 GitHub 内置 GITHUB_TOKEN，不再依赖会过期的 classic PAT。
# 此前 TIMELINE_GITHUB_TOKEN 于 9/19 失效，导致连续 11 轮在首个认证请求处 401 崩溃。
permissions:
  contents: write   # 允许提交 index.html / state.json
  pages: write      # 允许调用 Pages 构建 API（内置令牌的 push 不会自动触发 Pages 构建）

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run timeline agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python timeline_agent.py

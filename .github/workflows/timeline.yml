name: 中美出口管制时间线自动更新

on:
  schedule:
    # 每日 3 次北京时间（UTC+8）
    # 08:00 北京 = 00:00 UTC（早班，美东前日午后，抓隔夜发布）
    # 18:00 北京 = 10:00 UTC（晚班，联邦公报发布后数小时，抓当天新动作）
    # 00:00 北京 = 16:00 UTC（夜班，美东上午，抓当日美方新动作）
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: # 手动触发

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run timeline agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.TIMELINE_GITHUB_TOKEN }}
        run: python timeline_agent.py
